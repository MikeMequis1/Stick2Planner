services:
  api:
    build: .
    image: stick2planner-api:local
    container_name: stick2planner-api
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      PORT: "8090"
      DB_PATH: /data/planner-server.sqlite
    volumes:
      - planner-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  planner-data:
