name: stick2planner
description: "Stick2Planner - planner visual offline-first para tablets Android."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Persistência local: SQLite tipado, com transações e migrações versionadas.
  drift: ^2.35.3
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  path: ^1.9.1

  # Datas, IDs e formatação.
  intl: ^0.20.3
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2
  flutter_markdown_plus: ^1.0.12
  crypto: ^3.0.8
  file_picker: ^13.3.2
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.5.0
  connectivity_plus: ^7.3.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen do drift.
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
